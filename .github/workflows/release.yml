name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to recover, for example v1.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.recordish-gradle-user-home

concurrency:
  group: recordish-stable-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare semantic release
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Update release PR or create draft release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release/release-please-config.json
          manifest-file: .github/release/.release-please-manifest.json

  publish-stable:
    name: Verify and publish stable release
    needs:
      - release-please
    if: >-
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release-created == 'true'
        ) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              inputs.tag ||
              needs.release-please.outputs.sha
            }}

      - name: Resolve and validate draft release
        id: release-info
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_TAG: ${{ needs.release-please.outputs.tag }}
          AUTOMATIC_SHA: ${{ needs.release-please.outputs.sha }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${RECOVERY_TAG}"
          else
            tag="${AUTOMATIC_TAG}"
          fi

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable tag must be exactly vMAJOR.MINOR.PATCH."
            exit 1
          fi

          version="${tag#v}"
          release_draft="$(
            gh release view "${tag}" --json isDraft --jq '.isDraft'
          )"
          if [[ "${release_draft}" != "true" ]]; then
            echo "::error::${tag} is not an existing draft release."
            exit 1
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          tagged_sha="$(git rev-list -n 1 "${tag}")"
          if [[ "${checked_out_sha}" != "${tagged_sha}" ]]; then
            echo "::error::Checkout ${checked_out_sha} does not match ${tag} at ${tagged_sha}."
            exit 1
          fi
          if [[ -n "${AUTOMATIC_SHA}" && "${checked_out_sha}" != "${AUTOMATIC_SHA}" ]]; then
            echo "::error::Release Please SHA does not match the tagged commit."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Java 8 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Remember Java 8 home
        shell: bash
        run: echo "RECORDISH_JDK8=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Install Java 17 Gradle host
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build exact stable version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-info.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            clean \
            build \
            "-PmodVersion=${RELEASE_VERSION}" \
            "-Dorg.gradle.java.installations.paths=${RECORDISH_JDK8}"

      - name: Verify and package stable artifact
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-info.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-info.outputs.version }}
        run: |
          runtime_version="${RELEASE_VERSION}-forge-1.8.9"
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' -print | sort
          )
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one remapped JAR in build/libs."
            find build -maxdepth 3 -type f -name '*.jar' -print || true
            exit 1
          fi

          jar_path="${jars[0]}"
          expected_name="recordish-${RELEASE_VERSION}-forge-1.8.9.jar"
          if [[ "$(basename "${jar_path}")" != "${expected_name}" ]]; then
            echo "::error::Expected ${expected_name}, got $(basename "${jar_path}")."
            exit 1
          fi

          jar tf "${jar_path}" > "${RUNNER_TEMP}/recordish-jar-entries.txt"
          grep -Fx "dev/recordish/RecordishMod.class" \
            "${RUNNER_TEMP}/recordish-jar-entries.txt"
          grep -Fx "assets/recordish/icon.png" \
            "${RUNNER_TEMP}/recordish-jar-entries.txt"
          grep -Fx "mixins.recordish.json" \
            "${RUNNER_TEMP}/recordish-jar-entries.txt"
          if grep -Eq \
            "^(dev/recordable/|assets/recordable/|mixins\\.recordable)" \
            "${RUNNER_TEMP}/recordish-jar-entries.txt"; then
            echo "::error::Legacy Recordable internals remain in ${jar_path}."
            exit 1
          fi
          unzip -p "${jar_path}" mcmod.info |
            grep -F "\"version\": \"${runtime_version}\""
          unzip -p "${jar_path}" META-INF/MANIFEST.MF |
            tr -d '\r' |
            grep -F "Implementation-Version: ${runtime_version}"
          javap -verbose -classpath "${jar_path}" dev.recordish.RecordishMod |
            grep -F "major version: 52"

          node .github/release/package-release.mjs \
            --jar "${jar_path}" \
            --version "${RELEASE_VERSION}" \
            --channel stable \
            --output-dir dist/stable \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "$(git rev-parse HEAD)" \
            --tag "${RELEASE_TAG}"

          echo "jar=dist/stable/${expected_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/stable/${expected_name}.sha256" \
            >> "${GITHUB_OUTPUT}"
          echo "manifest=dist/stable/release-manifest.json" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${{ steps.package.outputs.jar }}" \
            "${{ steps.package.outputs.checksum }}" \
            "${{ steps.package.outputs.manifest }}" \
            --clobber

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --prerelease=false \
            --latest
